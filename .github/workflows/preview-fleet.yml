# Preview-fleet: kör preview-trattens EXAKTA kedja (freeze → designer →
# verify med hjälte-klamp + bevis-lyftets placerings-stege) över sajtflottan
# (scripts/day0-sites.ts) och samlar fördelningen av utfall. Se
# scripts/fleet-loop/preview-fleet.ts.
#
name: Preview fleet
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Antal sajter (default 100)"
        required: false
        default: "100"
      offset:
        description: "Hoppa över de första N sajterna (vågkörningar)"
        required: false
        default: "0"
      conc:
        description: "Samtidiga sajter"
        required: false
        default: "3"

concurrency:
  group: preview-fleet
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium (with system deps)
        run: bunx playwright install --with-deps chromium

      - name: Run the preview fleet
        run: >
          bun run scripts/fleet-loop/preview-fleet.ts
          --limit=${{ github.event.inputs.limit || '100' }}
          --offset=${{ github.event.inputs.offset || '0' }}
          --conc=${{ github.event.inputs.conc || '3' }}

      - name: Trim heavy artifacts (frozen pages + after-DOM)
        if: always()
        run: |
          find fleet-preview -name "frozen-home.html" -delete 2>/dev/null || true
          find fleet-preview -name "*-after.html" -delete 2>/dev/null || true

      # Resultaten till evidens-bucketen — Actions-artefaktens 14-dagars-
      # retention är skälet till att yield-aggregatet aldrig kunnat byggas
      # i efterhand (fynd 2026-07-29).
      - name: Upload results to angel-evidence (fleet-rerun)
        if: always()
        run: |
          if [ -f fleet-preview/results.json ]; then
            bun run scripts/fleet-loop/upload-results.ts --file=fleet-preview/results.json --name=results-${{ github.event.inputs.offset || '0' }}.json
          fi

      - name: Upload fleet results (14 dagar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-preview
          path: fleet-preview
          retention-days: 14
          if-no-files-found: ignore
