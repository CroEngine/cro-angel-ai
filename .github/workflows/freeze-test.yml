# Freeze-test (ägarfynd 2026-07-28: frysningens visuella kvalitet): kör
# högfidelitets-frysningen på EN URL med produktionens browser-väg
# (Browserbase-nycklarna finns bara här), skjuter skärmdumpar av den frysta
# kopian och laddar upp till angel-evidence under _diag — publika URL:er i
# loggen så resultatet kan granskas utan artefakt-nedladdning.
# Dispatch-bar från vilken gren som helst (workflow-filen följer grenen).

name: Freeze test
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Sida att frysa (https://…)"
        required: true
      name:
        description: "Slug för uppladdningen (t.ex. tibber)"
        required: true

concurrency:
  group: freeze-test-${{ inputs.name }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    # 20, inte 12: playwright-installens apt-steg kan ensamt ta ~10 min på en
    # långsam runner (dropbox-körningen 29/7 giljotinerades mitt i fidelity-
    # steget) — själva frysningen behöver bara ~3 min.
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium (with system deps)
        run: bunx playwright install --with-deps chromium

      # --ref-shot: det browsern SJÄLV såg (facit för pixel-banden och sida-
      # vid-sida-rapporten). --stats-out: livesidans rubriker/text/antal
      # (facit för paritetskollen). Båda ur samma session som frysningen.
      - name: Freeze (browser-först med Browserbase)
        run: bun run scripts/redesign/freeze-page.ts --url="${{ inputs.url }}" --out=freeze-out/frozen.html --ref-shot=freeze-out/shots/ref.png --stats-out=freeze-out/shots/live-stats.json

      - name: Screenshot the frozen copy (nätverk tillåtet)
        run: bun run scripts/diag/freeze-shot.ts --frozen=freeze-out/frozen.html --out=freeze-out/shots

      # Kompletthetsmåttet (ägarfråga 2026-07-28): DOM-medietäckning — bilder,
      # spelare, bakgrunder, typsnitt. Med live-referens läggs pixel-banden
      # till (avvikande ytor för inringning i rapporten); utan referens
      # (statisk väg) körs enbart kompletthetsmåtten.
      - name: Completeness score (DOM media coverage)
        run: |
          if [ -f freeze-out/shots/ref.png ]; then
            bun run scripts/diag/freeze-fidelity.ts --ref=freeze-out/shots/ref.png --frozen=freeze-out/frozen.html --out=freeze-out/shots
          else
            bun run scripts/diag/freeze-fidelity.ts --frozen=freeze-out/frozen.html --out=freeze-out/shots
          fi

      # Paritetskollen (ägarens "dubbelkolla på fler än 1 sätt"): innehålls-
      # jämförelse live↔fryst — rubrik-täckning, text-kvot, länk-/bildantal.
      - name: Text parity (live vs frozen)
        run: bun run scripts/diag/freeze-parity.ts --frozen=freeze-out/frozen.html --stats=freeze-out/shots/live-stats.json --out=freeze-out/shots

      - name: Upload to angel-evidence (_diag) + print public URLs
        run: bun run scripts/diag/freeze-test-upload.ts --name="${{ inputs.name }}" --dir=freeze-out/shots --frozen=freeze-out/frozen.html

      - name: Upload run artifacts (reserv)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freeze-test-${{ inputs.name }}
          path: freeze-out
          retention-days: 7
          if-no-files-found: ignore
