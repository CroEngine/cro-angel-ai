# Migrations-applikatorn — gör schema-appliceringen till ETT klick i stället för
# en lokal CLI-dans. Ingen auto-körning på push: DDL mot prod-DB ska vara ett
# medvetet beslut, så den triggas bara manuellt (workflow_dispatch).
#
#   mode=list  (default)  supabase migration list — VISAR väntande migrationer,
#                         ändrar INGET. Kör alltid detta först.
#   mode=push             supabase db push — applicerar supabase/migrations/*.
#
# Kräver repo-secrets SUPABASE_ACCESS_TOKEN (CLI-auth, Supabase → Account →
# Access Tokens) och SUPABASE_DB_PASSWORD (Project → Settings → Database).
# Saknas de är körningen en loggad no-op — aldrig röd av fel anledning.
# Projekt-ref läses ur supabase/config.toml (ingen hårdkodning).

name: DB migrate
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list = preview pending migrations (safe, no changes) · push = apply them"
        type: choice
        options: [list, push]
        default: list

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: List or apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD not set — nothing to do. Add both repo secrets to enable."
            exit 0
          fi
          REF=$(grep -E '^project_id' supabase/config.toml | sed -E 's/^project_id[[:space:]]*=[[:space:]]*"?([^"]+)"?.*$/\1/')
          if [ -z "$REF" ]; then echo "::error::could not read project_id from supabase/config.toml"; exit 1; fi
          echo "Linking project $REF …"
          supabase link --project-ref "$REF"
          echo "── Pending migrations (Local not yet on Remote) ──"
          supabase migration list --linked || true
          if [ "${MODE:-list}" = "push" ]; then
            echo "── mode=push — applying with 'supabase db push' ──"
            supabase db push
            echo "── Post-apply state ──"
            supabase migration list --linked || true
          else
            echo "::notice::mode=list — no changes applied. Re-run this workflow with mode=push to apply the pending migrations above."
          fi
