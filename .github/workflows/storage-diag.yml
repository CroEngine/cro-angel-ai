# Storage-diagnos: kör content-type-matrisen mot riktiga storage-servern i
# samma miljö som preview-arbetaren (samma bun, samma secrets). Se
# scripts/diag/storage-content-type.ts för vad som testas och varför.
#
# Push-trigger på diagnosgrenen är tillfällig (snabb feedbackloop under
# felsökningen); workflow_dispatch är den bestående vägen.

name: Storage diag
on:
  workflow_dispatch:
  push:
    branches:
      - claude/bold-ride-wtqp00

concurrency:
  group: storage-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run content-type matrix (+ heal fresh report)
        run: bun run scripts/diag/storage-content-type.ts --heal=c51d8c16-56a6-4eef-b585-0a630436a4df
