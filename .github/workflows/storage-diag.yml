# Storage-diagnos: kör content-type-matrisen mot riktiga storage-servern i
# samma miljö som preview-arbetaren (samma bun, samma secrets). Se
# scripts/diag/storage-content-type.ts för vad som testas och varför.
#
# Slutsats 2026-07-27 (runda 2, run 30272507959): lagringen tar typen
# korrekt för ALLA vägar — men publika ytan skriver om just HTML till
# text/plain + nosniff vid servering (nätfiskeskydd på supabase.co).
# PNG/JSON serveras rätt. Därför serveras rapporter via vår egen origin
# (/api/preview/report). Behålls som dispatch-verktyg för framtida
# storage-frågor.

name: Storage diag
on:
  workflow_dispatch:

concurrency:
  group: storage-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --heal-flaggan borttagen (granskningsfynd 2026-07-28): skriptet har
      # aldrig implementerat den — den refererade dessutom ett engångs-jobb-id.
      - name: Run content-type matrix
        run: bun run scripts/diag/storage-content-type.ts
