# Bredd-verifiering — hela kedjan mot ~20 riktiga sajter (ägarorder
# 2026-07-17): frysning (SPA-vägen inkl.) → extraktion → riktig AI-design →
# validering → pixelgrindar → FÖRE/EFTER-skärmdumpar → rapport till
# angel-evidence (breadth/<run>/report.html, publik läsning).
#
# Segmentunderlaget är SYNTETISKT (märkt) — det som verifieras är maskineriet.
# Inget skrivs till angel_sites/angel_events. Manuell dispatch endast.

name: Breadth verify
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets-JSON (default scripts/verify/breadth-20.json)"
        required: false
      run_id:
        description: "Run-id för rapportmappen (default GitHub run id)"
        required: false

jobs:
  breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium (with system deps)
        run: bunx playwright install --with-deps chromium

      - name: Run breadth verification
        run: |
          TARGETS="${{ github.event.inputs.targets }}"
          if [ -z "$TARGETS" ]; then TARGETS="scripts/verify/breadth-20.json"; fi
          RUN="${{ github.event.inputs.run_id }}"
          if [ -z "$RUN" ]; then RUN="gh-${{ github.run_id }}"; fi
          bun run scripts/verify/breadth-verify.ts --targets="$TARGETS" --out=breadth-verify-out --upload=1 --run="$RUN"

      - name: Upload run artifacts (14 dagar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breadth-verify-out
          path: breadth-verify-out
          retention-days: 14
          if-no-files-found: ignore
