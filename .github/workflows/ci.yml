name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium (with system deps)
        run: bunx playwright install --with-deps chromium

      # Kodgen-pinne: public/adaptive-harvest.js är GENERERAD ur
      # src/lib/tests/scripts/* (bun run build:harvest). Utan denna diff kan
      # källa och incheckad artefakt glida isär tyst — det hände i Fas 1, där
      # struktur-skannern lades direkt i den genererade filen och nästa
      # regenerering hade raderat den. Måste köra under bun (samma runtime som
      # generatorn: toString()-inlining skiljer sig under andra transpilers).
      - name: Harvest bundle codegen pin
        run: bun run build:harvest && git diff --exit-code -- public/adaptive-harvest.js

      - name: Typecheck
        run: bun run typecheck

      # Hela enhetssviten (decide, serve, winner, earned, claims, bot, …) —
      # den saknades i CI: bara browser-suiterna kördes, så en trasig ren
      # kärnfunktion kunde passera grönt.
      - name: Run unit tests
        run: bunx vitest run --exclude "src/lib/tests/snapshot/**"

      # Serving-vägens smoke: riktiga snippeten (källa + minifierad artefakt)
      # i riktig Chromium — bot-grind, exakt applicering, idempotens,
      # byte-exakt reset, allt-eller-inget. Det enda som rör kundens sida
      # ska aldrig kunna brytas tyst.
      - name: Serving smoke (source + minified)
        run: node scripts/ci/serving-smoke.mjs

      # Hela produktionsbygget inkl. minify-steget — annars möter minifieraren
      # produktion första gången i Netlifys deploy, där ett fel blockerar
      # releasen i stället för PR:en.
      - name: Production build (vite + snippet minify)
        run: bun run build

      - name: Run freeze-visibility test
        run: bunx vitest run src/lib/tests/snapshot/__tests__/freeze-visibility.test.ts

      - name: Run render-canary test
        run: bunx vitest run src/lib/tests/snapshot/__tests__/render-canary.test.ts

      - name: Run snapshot diff tests
        run: bunx vitest run src/lib/tests/snapshot/__tests__/snapshot.test.ts

      - name: Run extractor unit tests
        run: >-
          bunx vitest run
          src/lib/tests/__tests__/audit-helpers.test.ts
          src/lib/tests/snapshot/__tests__/fetch-records.test.ts
          src/lib/tests/scripts/__tests__/sections-walker.test.ts
          src/lib/tests/scripts/__tests__/ctas-logo.test.ts
          src/lib/tests/scripts/__tests__/trust-signals.test.ts
          src/lib/tests/scripts/__tests__/collect-visibility.test.ts

      - name: Run trust-signal benchmark gate (committed corpus)
        run: bunx vitest run src/lib/tests/trust-eval/__tests__/trust-eval.test.ts

      - name: Run archetype goal-kind tests
        run: bunx vitest run src/lib/tests/snapshot/__tests__/archetype-goals.test.ts

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-canary-artifacts
          path: |
            corpus/**/render-canary.families.json
            corpus/**/render-canary.json
          if-no-files-found: ignore
          retention-days: 14
