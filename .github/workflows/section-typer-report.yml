# Sektionstypnings-TAKET — BRED flerperspektiv-rapport (ägaren 2026-07-24: "ge
# alla sajter ett nytt försök, gör det väldigt informativt, tänk i olika
# perspektiv"). Kör golvet + det riktiga Haiku-taket över ~30 sajter tvärs
# kategorier och laddar upp rapporten (läsbar + JSON) som artefakt + i loggen.
# Använder repo-secreten ANTHROPIC_API_KEY (ingen ny nyckel behövs).

name: Section-typer report
on:
  push:
    paths:
      - ".github/workflows/section-typer-report.yml"
      - "scripts/redesign/section-typer-report.ts"
  workflow_dispatch:
    inputs:
      urls:
        description: "Komma-separerad sajtlista (annars den inbyggda breda listan)"
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the broad section-typer report
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY saknas — taket blir en no-op."
          fi
          ARGS=""
          if [ -n "${{ github.event.inputs.urls }}" ]; then ARGS="--urls=${{ github.event.inputs.urls }}"; fi
          bun run scripts/redesign/section-typer-report.ts $ARGS | tee section-typer-report.txt

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section-typer-report
          path: section-typer-report.txt
          retention-days: 14
          if-no-files-found: warn
