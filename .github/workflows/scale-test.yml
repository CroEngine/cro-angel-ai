# Skala-test: hela sektionskedjan (golv → tak → gruppera → ranka) över ~200
# riktiga sajter, samtidigt, MED Browserbase-render som skal-fallback (statisk
# hämtning <3 sektioner → rendera + återfånga). Skriver aggregat + verifierings-
# sample + capture/recovery-stats i loggen och full JSON som artefakt.
# Secrets: ANTHROPIC_API_KEY (taket) + BROWSERBASE_API_KEY/PROJECT_ID (render).

name: Section scale test
on:
  push:
    paths:
      - ".github/workflows/scale-test.yml"
      - "scripts/redesign/scale-test.ts"
  workflow_dispatch:
    inputs:
      urls:
        description: "Komma-separerad sajtlista (annars den inbyggda ~200-listan)"
        required: false

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the 200-site scale test
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::ANTHROPIC_API_KEY saknas — taket/rankningen blir no-op."; fi
          if [ -z "$BROWSERBASE_API_KEY" ] || [ -z "$BROWSERBASE_PROJECT_ID" ]; then echo "::warning::BROWSERBASE-secrets saknas — render-fallbacken hoppas över (bara statisk hämtning)."; fi
          ARGS=""
          if [ -n "${{ github.event.inputs.urls }}" ]; then ARGS="--urls=${{ github.event.inputs.urls }}"; fi
          bun run scripts/redesign/scale-test.ts $ARGS | tee scale-test.out
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-test
          path: |
            scale-test.out
            scale-test.json
          retention-days: 14
          if-no-files-found: warn
