# Skala-test: hela sektionskedjan (golv → tak → gruppera → ranka) över ~200
# riktiga sajter, samtidigt. Skriver aggregat + verifierings-sample i loggen och
# full JSON som artefakt. Använder repo-secreten ANTHROPIC_API_KEY.

name: Section scale test
on:
  push:
    paths:
      - ".github/workflows/scale-test.yml"
      - "scripts/redesign/scale-test.ts"
  workflow_dispatch:
    inputs:
      urls:
        description: "Komma-separerad sajtlista (annars den inbyggda ~200-listan)"
        required: false

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the 200-site scale test
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::ANTHROPIC_API_KEY saknas — taket/rankningen blir no-op."; fi
          ARGS=""
          if [ -n "${{ github.event.inputs.urls }}" ]; then ARGS="--urls=${{ github.event.inputs.urls }}"; fi
          bun run scripts/redesign/scale-test.ts $ARGS | tee scale-test.out
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-test
          path: |
            scale-test.out
            scale-test.json
          retention-days: 14
          if-no-files-found: warn
